# Local Postgres for development. Not for production use.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: markx
      POSTGRES_PASSWORD: markx
      POSTGRES_DB: markx
    ports:
      - '5432:5432'
    volumes:
      - markx-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U markx -d markx']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  markx-pgdata:
