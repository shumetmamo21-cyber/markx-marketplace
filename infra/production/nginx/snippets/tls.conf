# TLS for the public site (D-091): TLS 1.2 and 1.3 only, forward-secret
# ciphers only (Mozilla's "intermediate" profile without the DHE suites,
# which need a separate parameters file). The certificate and key are read
# from /etc/nginx/tls, mounted read-only from the host (docs/DEPLOYMENT.md).
ssl_certificate /etc/nginx/tls/fullchain.pem;
ssl_certificate_key /etc/nginx/tls/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:MarkXTLS:10m;
ssl_session_tickets off;
