# Headers every upstream gets (SEC-3, D-084; D-091).
#
# X-Forwarded-For is SET to the address this proxy saw, never appended to:
# this is the edge, so anything a visitor sent in that header is discarded.
# The API believes it only from the proxy network (MARKX_TRUSTED_PROXIES).
# Behind Cloudflare, cloudflare-real-ip.conf must be enabled first, or every
# visitor would be one of Cloudflare's addresses.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-ID $request_id;
proxy_set_header Forwarded "";
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_next_upstream off;
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
# The proxy sends HSTS itself, once, for every answer (the template).
proxy_hide_header Strict-Transport-Security;
