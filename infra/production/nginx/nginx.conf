# The MarkX reverse proxy (blueprint F.0, F.13, H.2; D-091).
#
# One public site: /api/ goes to the API, everything else to the web app.
# TLS ends here. The proxy runs as an unprivileged user on ports 8080 and
# 8443; the Compose file publishes them as 80 and 443. Nothing else on the
# server is reachable from outside.
#
# The per-site server blocks are rendered from templates/markx.conf.template
# at start-up, with MARKX_SITE_HOSTNAME and MARKX_HSTS_MAX_AGE filled in.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # No version in the Server header or on error pages.
    server_tokens off;

    # Paths only, never query strings: they can hold search terms and the
    # tracking link's signature (the API logs the same way, F.12). No cookie,
    # no user agent, no referrer.
    log_format markx escape=json
        '{"time":"$time_iso8601","request_id":"$request_id",'
        '"remote_addr":"$remote_addr","method":"$request_method","path":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout markx;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    keepalive_requests 1000;

    # Slow or oversized requests are cut off here, before the application.
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    client_max_body_size 1m;
    client_body_buffer_size 64k;
    large_client_header_buffers 4 16k;

    # Compression is left to the web app (Next.js compresses its own pages);
    # compressing API answers that carry the anti-forgery token alongside
    # what a visitor typed would invite BREACH-style guessing.
    gzip off;

    # Docker's own name server, so a container that is recreated (a deploy,
    # a rollback) is found at its new address within ten seconds.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Edge rate limits per visitor address (H.2: "at the edge and in the
    # API"). Deliberately generous: many Ethiopian mobile users share one
    # carrier address, and the API's own per-number and per-address limits
    # are the precise ones. Tune with measurements, not guesses.
    limit_req_zone $binary_remote_addr zone=markx_requests:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=markx_signin:10m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=markx_connections:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream markx_web {
        zone markx_web 64k;
        server web:3000 resolve;
        keepalive 16;
    }

    upstream markx_api {
        zone markx_api 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
