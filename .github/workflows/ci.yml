# The checks every change must pass (blueprint P1; docs/SETUP.md). Runs on
# GitHub's free hosted runners; nothing here is deployed or paid for.
name: CI

#
# D-097: one run per change. A pull request runs it (opened, every push to
# it); main runs it on every push (each merge); anyone with access can start
# it by hand. A push to a branch without a pull request no longer runs it, so
# a push to a pull request's branch no longer starts two full runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# D-097: runs of one pull request share a group (by its NUMBER, never by
# branch name: on a public repository a fork's branch may also be called
# main), so a newer push cancels the older run of that pull request. Every
# other run (main, by hand) has a group of its own and is never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # D-097: decides whether this change is documents only. Only then are the
  # heavy jobs skipped; "CI result" below still reports a pass. Anything it
  # cannot decide counts as code, so every job runs.
  changes:
    name: What changed (documents only?)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base commit is needed for the comparison
      - name: Compare with the base
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Documents that a test or check reads count as code, so a change
          # to one still runs every job. Searched for D-097: no test, script
          # or workflow reads a document's text; add any that does here.
          read_by_checks=()
          is_document() {
            case "$1" in
              # Inside an application, infrastructure or CI folder a file may
              # be part of a build or a check, whatever its name.
              apps/* | infra/* | .github/*) return 1 ;;
              *.md) ;;
              *) return 1 ;;
            esac
            for kept in "${read_by_checks[@]}"; do
              [[ "$1" == "$kept" ]] && return 1
            done
            return 0
          }
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;; # started by hand: every job
          esac
          code=true
          # --no-renames: a file moved into docs/ also counts where it left.
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]] \
            && files=$(git diff --no-renames --name-only "$base" "$GITHUB_SHA") \
            && [[ -n "$files" ]]; then
            code=false
            while IFS= read -r file; do
              if is_document "$file"; then
                echo "document: $file"
              else
                echo "code:     $file"
                code=true
              fi
            done <<< "$files"
          else
            echo "No base to compare with (or nothing changed): every job runs."
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" == true ]]; then
            echo "Code or settings changed: every job runs."
          else
            echo "Documents only: the heavy jobs are skipped; the secret scan still runs."
          fi

  api:
    name: API (lint, types, migrations, tests)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # BK-17: a pinned PostgreSQL 17 release, the production image's own.
        image: postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
        env:
          # A throwaway database inside the runner; the same development-only
          # password as docs/SETUP.md. Not a secret.
          POSTGRES_PASSWORD: postgres_dev_only
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8 --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      # D-090: the object storage tests run against a real MinIO, never
      # against Amazon or Cloudflare. The same pinned image as Compose; the
      # tests make and remove their own buckets.
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
        env:
          MINIO_ROOT_USER: markx-dev-only
          MINIO_ROOT_PASSWORD: markx-minio-dev-only-password
          # D-094: the recovery drill's file stores and its backup destination.
          MINIO_DEFAULT_BUCKETS: markx-private,markx-public,markx-backups
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres_dev_only
      MARKX_TEST_MINIO_ENDPOINT: http://127.0.0.1:9000
      MARKX_TEST_MINIO_ACCESS_KEY: markx-dev-only
      MARKX_TEST_MINIO_SECRET_KEY: markx-minio-dev-only-password
      # A missing MinIO fails the run here instead of skipping its tests.
      MARKX_TEST_MINIO_REQUIRED: "1"
      # D-094: the backup tests need PostgreSQL 17's client tools; the runner's
      # own are older, so the server's image runs them. Missing tools fail the
      # run instead of skipping the tests. BK-17: pinned to 17.12.
      MARKX_TEST_PG_DUMP: docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c pg_dump
      MARKX_TEST_PG_RESTORE: docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c pg_restore
      MARKX_TEST_PSQL: docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c psql
      # Also requires the least-privilege MinIO users (made in a step below).
      MARKX_TEST_BACKUP_REQUIRED: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install the locked dependencies
        run: uv sync --locked
      - name: Create the MarkX roles and database
        run: ../../infra/postgres/bootstrap.sh markx
      # BK-17: the backup tests and the drills use least-privilege MinIO
      # users, never the root key: the server's backup key cannot delete, the
      # recovery machine's key and the file stores' key only read.
      - name: Least-privilege MinIO users for the backup (development values only)
        run: MC="docker exec -i ${{ job.services.minio.id }} mc" ../../infra/backup/minio-least-privilege.sh
      - name: Lint
        run: uv run ruff check .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Strict type checks
        run: uv run mypy markx
      - name: Migrations apply and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests (one session; they share one test database)
        run: uv run pytest -q -p no:cacheprovider
      # D-061: the back end's own description must match the API exactly, so
      # every API change is visible in review; the web app's copy may lag
      # behind additions (another session regenerates it) but never changes.
      - name: The API description in apps/api is current
        run: uv run python -m scripts.check_openapi_copy --exact openapi.json
      - name: The web app's copy of the API description is still true
        run: uv run python -m scripts.check_openapi_copy ../web/src/lib/api/openapi.json
      # D-094: the recovery drill on the demo data, end to end: a backup set
      # (database and files) encrypted and uploaded to a MinIO backup bucket,
      # verified, restored into a NEW database and NEW buckets, compared, and
      # seven injected faults each refused. Keys are made for this run only.
      # Nothing here reaches a real provider. D-096 (BK-17): the backup uses
      # the server's kind of key (no delete) and a read-only key for the
      # files; the drill's own buckets are made with a key for just that.
      - name: Backup, off-server copy and recovery drill (MinIO stand-in)
        env:
          MARKX_FILE_STORAGE_PROVIDER: minio
          MARKX_STORAGE_ENDPOINT_URL: http://127.0.0.1:9000
          MARKX_STORAGE_ACCESS_KEY_ID: markx-dev-only
          MARKX_STORAGE_SECRET_ACCESS_KEY: markx-minio-dev-only-password
          MARKX_STORAGE_PRIVATE_BUCKET: markx-private
          MARKX_STORAGE_PUBLIC_BUCKET: markx-public
          MARKX_RELEASE: ${{ github.sha }}
          MARKX_BACKUP_DATABASE: markx
          MARKX_BACKUP_PG_DUMP_COMMAND: docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c pg_dump
          MARKX_BACKUP_PG_RESTORE_COMMAND: docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c pg_restore
          MARKX_BACKUP_PSQL_COMMAND: docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c psql
          MARKX_BACKUP_DESTINATION: minio
          MARKX_BACKUP_DESTINATION_ENDPOINT_URL: http://127.0.0.1:9000
          MARKX_BACKUP_DESTINATION_BUCKET: markx-backups
          MARKX_BACKUP_DESTINATION_PREFIX: markx/ci
          MARKX_BACKUP_DESTINATION_ACCESS_KEY_ID: markx-backup-writer-dev-only
          MARKX_BACKUP_DESTINATION_SECRET_ACCESS_KEY: markx-backup-writer-dev-only-secret
          MARKX_BACKUP_SOURCE_PROVIDER: minio
          MARKX_BACKUP_SOURCE_ENDPOINT_URL: http://127.0.0.1:9000
          MARKX_BACKUP_SOURCE_PRIVATE_BUCKET: markx-private
          MARKX_BACKUP_SOURCE_PUBLIC_BUCKET: markx-public
          MARKX_BACKUP_SOURCE_ACCESS_KEY_ID: markx-source-reader-dev-only
          MARKX_BACKUP_SOURCE_SECRET_ACCESS_KEY: markx-source-reader-dev-only-secret
          MARKX_RESTORE_TARGET_ACCESS_KEY_ID: markx-restore-target-dev-only
          MARKX_RESTORE_TARGET_SECRET_ACCESS_KEY: markx-restore-target-dev-only-secret
        run: |
          uv run python -m scripts.seed_demo > /dev/null
          keys="$RUNNER_TEMP/backup-keys"
          uv run python -m markx.backup keygen --out "$keys" > /dev/null
          export MARKX_BACKUP_PUBLIC_KEY_FILE="$keys/backup-public.key" MARKX_BACKUP_SIGNING_KEY_FILE="$keys/signing.key"
          export MARKX_BACKUP_WORK_DIR="$RUNNER_TEMP/backup-work"
          uv run python -m markx.backup drill --seed-sample-files \
            --recovery-key "$keys/recovery.key" --signer "$keys/signer-public.key" \
            --report "$RUNNER_TEMP/restore-drill-report.json" | tee "$RUNNER_TEMP/restore-drill.txt"
          grep -q "DRILL PASSED" "$RUNNER_TEMP/restore-drill.txt"
      # D-096 (BK-2, BK-6): the monthly drill as the runbook has it, on a
      # separate recovery machine: this runner plays it. No backup is taken;
      # the newest set is read with the bucket's READ-ONLY key and restored
      # into a throwaway PostgreSQL 17.12 container with no network at all,
      # as the owner role, never the superuser. The server's signing key is
      # not used: only the recovery key and the signer's public key.
      - name: Off-server recovery drill (read-only key, throwaway PostgreSQL without network)
        env:
          MARKX_BACKUP_DESTINATION: minio
          MARKX_BACKUP_DESTINATION_ENDPOINT_URL: http://127.0.0.1:9000
          MARKX_BACKUP_DESTINATION_BUCKET: markx-backups
          MARKX_BACKUP_DESTINATION_PREFIX: markx/ci
          MARKX_BACKUP_DESTINATION_ACCESS_KEY_ID: markx-backup-reader-dev-only
          MARKX_BACKUP_DESTINATION_SECRET_ACCESS_KEY: markx-backup-reader-dev-only-secret
          MARKX_RECOVERY_SOCKET_DIR: ${{ runner.temp }}/recovery-socket
        run: |
          keys="$RUNNER_TEMP/backup-keys"
          eval "$(../../infra/backup/recovery-host.sh start)"
          uv run python -m markx.backup drill --from-destination \
            --recovery-key "$keys/recovery.key" --signer "$keys/signer-public.key" \
            --report "$RUNNER_TEMP/offsite-drill-report.json" | tee "$RUNNER_TEMP/offsite-drill.txt"
          ../../infra/backup/recovery-host.sh stop
          grep -q "DRILL PASSED" "$RUNNER_TEMP/offsite-drill.txt"
          grep -q "as the owner role (not a superuser)" "$RUNNER_TEMP/offsite-drill.txt"
      - name: Remove the run's backup keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/backup-keys"
      - name: Keep the restore drill's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill
          path: |
            ${{ runner.temp }}/restore-drill-report.json
            ${{ runner.temp }}/restore-drill.txt
            ${{ runner.temp }}/offsite-drill-report.json
            ${{ runner.temp }}/offsite-drill.txt
          if-no-files-found: warn
          retention-days: 30

  web:
    name: Web app (lint, types, unit tests, build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install the locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generated API types match the API description
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - name: Lint
        run: npm run lint
      - name: Strict type checks
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  # D-084: the secret scan and the dependency audits the blueprint's pipeline
  # asks for on every change. D-097: it runs on documents-only changes too,
  # since a document can leak a secret as easily as code. Findings are reviewed, never silently ignored:
  # see .gitleaks.toml and .github/security/npm-audit-allowlist.json.
  security:
    name: Security (secret scan, dependency audits)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, so a secret removed later is still found
      - name: Secret scan of every commit (Gitleaks)
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$name"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $name\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict -
          tar -xzf "$name" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose --exit-code 1 .
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Python dependency audit (pip-audit, development tools included)
        working-directory: apps/api
        run: |
          uv sync --locked
          uv run pip-audit --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: npm dependency audit (development dependencies included)
        run: |
          (cd apps/web && npm ci --no-audit --no-fund)
          node .github/scripts/npm-audit-gate.mjs apps/web

  containers:
    name: Containers (API and web images build, Compose files are valid)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # D-103: every image pulled from outside is pinned to its digest.
      - name: Every outside image is pinned to its exact content (digest)
        run: infra/check-image-pins.sh
      - name: The Compose file is valid
        run: |
          docker compose -f infra/compose/compose.yaml config --quiet
          MARKX_UID=1001 MARKX_GID=1001 MARKX_HOST_STORAGE=/tmp/storage \
            docker compose -f infra/compose/compose.yaml -f infra/compose/compose.ci.yaml config --quiet
      - name: The API and worker image builds
        run: docker build -t markx-api:ci apps/api
      - name: The image runs as an unprivileged user and holds no dev tools
        run: |
          test "$(docker run --rm markx-api:ci id -un)" = markx
          # D-103: the user id is set in the Dockerfile, not assumed.
          test "$(docker run --rm markx-api:ci id -u):$(docker run --rm markx-api:ci id -g)" = 999:999
          test "$(docker image inspect markx-api:ci --format '{{.Config.User}}')" = 999:999
          ! docker run --rm markx-api:ci python -c "import pytest"
      # SEC-3 (D-084): forwarded headers are read by the app, from the
      # configured proxies only, never by uvicorn's own default.
      - name: The image does not let uvicorn trust forwarded headers itself
        run: |
          docker image inspect markx-api:ci --format '{{json .Config.Cmd}}' | grep -q -- '--no-proxy-headers'
      - name: The worker and the migrations load in the image
        run: |
          docker run --rm markx-api:ci python -c "import markx.worker.runner, markx.main"
          docker run --rm markx-api:ci alembic --help > /dev/null
      # D-094: the backup service's image: the API's code plus PostgreSQL 17's
      # client tools, unprivileged, its commands loading.
      - name: The backup image builds, runs unprivileged and holds PostgreSQL 17's tools
        run: |
          docker build --target backup -t markx-backup:ci apps/api
          [[ "$(docker run --rm markx-backup:ci id -u)" != 0 ]]
          test "$(docker run --rm markx-backup:ci id -u):$(docker run --rm markx-backup:ci id -g)" = 999:999
          docker run --rm markx-backup:ci pg_dump --version | grep -q "PostgreSQL) 17\."
          docker run --rm markx-backup:ci pg_restore --version | grep -q "PostgreSQL) 17\."
          docker run --rm markx-backup:ci python -m markx.backup --help > /dev/null
      # D-091: the production Compose file with the example settings, and the
      # web image (standalone build, unprivileged, no development tools).
      - name: The production Compose file is valid with the example settings
        run: |
          dir="$RUNNER_TEMP/markx-config"; mkdir -p "$dir"
          for f in infra/production/env/*.env.example; do cp "$f" "$dir/$(basename "$f" .example)"; done
          sed -i "s|^MARKX_CONFIG_DIR=.*|MARKX_CONFIG_DIR=$dir|" "$dir/compose.env"
          MARKX_RELEASE=ci docker compose -f infra/production/compose.yaml --env-file "$dir/compose.env" config --quiet
      - name: The web image builds
        run: docker build -t markx-web:ci --build-arg MARKX_MEDIA_ORIGIN=https://media.example.invalid apps/web
      - name: The web image runs as an unprivileged user, without sources or development tools
        run: |
          test "$(docker run --rm --entrypoint id markx-web:ci -un)" = node
          test "$(docker image inspect markx-web:ci --format '{{.Config.User}}')" = 1000:1000
          docker run --rm --entrypoint sh markx-web:ci -c 'test ! -e /app/src && test ! -e /app/node_modules/vitest && test -f /app/server.js'
      - name: The web image refuses to start as production without its settings
        run: |
          set +e
          docker run --rm -e MARKX_ENV=production markx-web:ci > out.txt 2>&1
          status=$?
          set -e
          cat out.txt
          test "$status" = 2
          grep -q "MARKX_TURNSTILE_SITE_KEY must be set" out.txt

  # D-091: the production Compose file, deploy.sh and the proxy, rehearsed on
  # the runner with throwaway settings and MinIO. Nothing is deployed and no
  # outside service, domain or certificate authority is contacted.
  production-rehearsal:
    name: Production stack rehearsal (Compose, proxy, deploy, rollback)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse a deployment
        run: sudo -E infra/production/rehearsal/rehearse.sh

  # D-097: one result for the whole run. It passes when every job that had
  # to run passed: all of them for a code change; "What changed" and the
  # security job for a documents-only change, whose skipped heavy jobs count
  # as passed. Anything else (a failure, a cancellation, a heavy job skipped
  # on a code change) fails it.
  result:
    name: CI result
    if: always()
    needs: [changes, api, web, security, containers, production-rehearsal]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job passed
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          SECURITY: ${{ needs.security.result }}
          API: ${{ needs.api.result }}
          WEB: ${{ needs.web.result }}
          CONTAINERS: ${{ needs.containers.result }}
          REHEARSAL: ${{ needs.production-rehearsal.result }}
        run: |
          echo "code changed: ${CODE:-unknown}"
          echo "changes=$CHANGES security=$SECURITY api=$API web=$WEB containers=$CONTAINERS production-rehearsal=$REHEARSAL"
          ok=true
          [[ "$CHANGES" == success ]] || ok=false
          [[ "$SECURITY" == success ]] || ok=false
          for result in "$API" "$WEB" "$CONTAINERS" "$REHEARSAL"; do
            if [[ "$CODE" == false ]]; then
              [[ "$result" == skipped || "$result" == success ]] || ok=false
            else
              [[ "$result" == success ]] || ok=false
            fi
          done
          if [[ "$ok" != true ]]; then
            echo "CI failed: see the jobs above."
            exit 1
          fi
          echo "CI passed."
